buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}
plugins {
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'
apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

mixin {
    add sourceSets.main, "gravityapivs.refmap.json"
    config "gravityapivs.mixin.json"
}

sourceSets {
    asm {
        java {
            srcDirs = ['src/asm']
        }
        resources {
            srcDirs = ['src/asm/resources']
        }
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('allJar', Jar) {
    archiveBaseName.set("${mod_id}-all")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output)
    from({
        zipTree(tasks.jarJar.archiveFile)
    })
}

tasks.named('allJar', Jar).configure {
    finalizedBy 'reobfAllJar'
}

tasks.register('asmJar', Jar) {
    archiveBaseName.set("${mod_id}-asm")
    from(sourceSets.asm.output)
    from({
        file("build/reobfAllJar/output.jar")
    }) {
        into('')
        rename { "gravityapi-forge.jar" }
    }
    manifest {
        attributes(
                'Specification-Title'    : mod_id,
                'Specification-Version'  : project.version,
                'Implementation-Vendor'  : mod_authors
        )
    }
}

tasks.asmJar {
    dependsOn(tasks.allJar, tasks.compileAsmJava)
}

reobf {
    allJar {}
    asmJar {}
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 1. Maven Central MUST be top to fix the 'typetools' error
    mavenCentral()

    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }

    // 2. Valkyrien Skies & Kotlin Repos
    maven { url = 'https://maven.valkyrienskies.org' }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }

    // Modrinth Maven for VS 2.4.0
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    maven { url = "https://maven.bawnorton.com/releases" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.3")) {
        jarJar.ranged(it, "[0.3.3,)")
    }
    annotationProcessor "com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.3"
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.3")) {
        jarJar.ranged(it, "[0.3.3,)")
    }
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"

    // --- VS2 DEPENDENCIES ---
    implementation fg.deobf("thedarkcolour:kotlinforforge:4.11.0")
    implementation fg.deobf("org.valkyrienskies:valkyrienskies-120-forge:2.4.11")

    // Core API: Using '+' allows Gradle to find the version matching the mod automatically
    implementation "org.valkyrienskies.core:api:+"
    implementation "org.valkyrienskies.core:impl:+"
    implementation "org.valkyrienskies.core:util:+"

    implementation("org.joml:joml:1.10.5")

    // Explicitly add typetools to resolve the missing dependency error
    implementation "net.jodah:typetools:0.6.3"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}